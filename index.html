<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schade Systeem</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            margin: 0;
            padding: 30px;
        }

        .game {
            max-width: 700px;
            margin: auto;
            background: #252525;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat {
            flex: 1;
            background: #333;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .bar {
            height: 20px;
            background: #555;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .hp-bar {
            height: 100%;
            background: #e53935;
            width: 100%;
            transition: width 0.3s;
        }

        .shield-bar {
            height: 100%;
            background: #2196f3;
            width: 100%;
            transition: width 0.3s;
        }

        #action-buttons {
            text-align: center;
            margin-top: 25px;
        }

        .btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background: #c62828;
        }

        #log {
            margin-top: 25px;
            background: #111;
            padding: 15px;
            border-radius: 10px;
            min-height: 100px;
        }

        .log-item {
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

<div class="game">
    <h1>⚔️ Gevecht</h1>

    <div class="stats">
        <div class="stat">
            <strong>Speler</strong>
            <p>HP: <span id="hp">100</span></p>

            <div class="bar">
                <div id="hp-bar" class="hp-bar"></div>
            </div>

            <p>Schild: <span id="shield">50</span></p>

            <div class="bar">
                <div id="shield-bar" class="shield-bar"></div>
            </div>
        </div>

        <div class="stat">
            <strong>Vijand</strong>
            <p id="enemy-name">Vijand</p>
        </div>
    </div>

    <div id="action-buttons">
        <button class="btn" onclick="vijandSchiet()">Vijand schiet terug 💥</button>
    </div>

    <div id="log">
        <div class="log-item">Het gevecht begint!</div>
    </div>
</div>

<script>
    // Speler
    const speler = {
        hp: 100,
        maxHp: 100,
        schild: 50,
        maxSchild: 50
    };

    // Huidige vijand
    const huidigeVijand = {
        naam: "De Vijand"
    };

    // Interface bijwerken
    function updateInterface() {
        document.getElementById("hp").textContent = speler.hp;
        document.getElementById("shield").textContent = speler.schild;

        const hpPercentage =
            (speler.hp / speler.maxHp) * 100;

        const shieldPercentage =
            (speler.schild / speler.maxSchild) * 100;

        document.getElementById("hp-bar").style.width =
            hpPercentage + "%";

        document.getElementById("shield-bar").style.width =
            shieldPercentage + "%";
    }

    // Bericht toevoegen aan de log
    function logBericht(bericht) {
        const log = document.getElementById("log");

        const item = document.createElement("div");
        item.className = "log-item";
        item.textContent = bericht;

        log.appendChild(item);
    }

    // Vijand doet schade
    function vijandSchiet() {

        // Voorbeeldschade
        let schadeAanJou = Math.floor(Math.random() * 15) + 1;

        // Minimale schade is 5
        schadeAanJou = Math.max(5, schadeAanJou);

        // Als de speler een schild heeft
        if (speler.schild > 0) {

            speler.schild -= schadeAanJou;

            // Als het schild op is en er schade overblijft
            if (speler.schild < 0) {
                speler.hp += speler.schild;
                speler.schild = 0;
            }

        } else {

            // Geen schild, dus direct HP-schade
            speler.hp -= schadeAanJou;
        }

        logBericht(
            `💥 ${huidigeVijand.naam} schiet terug en doet ${schadeAanJou} schade.`
        );

        updateInterface();
        checkGameOver();
    }

    // Controleren of de speler dood is
    function checkGameOver() {

        if (speler.hp <= 0) {

            speler.hp = 0;

            updateInterface();

            logBericht(
                "💀 GEËLIMINEERD! Je hebt het niet overleefd. Volgende keer beter!"
            );

            document.getElementById("action-buttons").innerHTML = `
                <button class="btn" onclick="location.reload()">
                    Opnieuw proberen 🔄
                </button>
            `;
        }
    }

    // Startinterface
    updateInterface();
</script>

</body>
</html>
